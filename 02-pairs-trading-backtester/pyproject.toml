[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-pairs-trading-backtester"
version = "1.0.0"
description = "Institutional Pairs Trading, Dynamic Kalman Filter & Cointegration Backtesting Engine"
authors = [{ name = "Quantitative Engineering" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.8.0",
    "plotly>=5.18.0",
    "pytest>=8.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
