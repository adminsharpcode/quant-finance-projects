[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "value-momentum-everywhere"
version = "1.0.0"
description = "Institutional Value and Momentum Everywhere Factor Engine based on Asness, Moskowitz, & Pedersen (2013)"
readme = "README.md"
authors = [{ name = "adminsharpcode" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "matplotlib>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
