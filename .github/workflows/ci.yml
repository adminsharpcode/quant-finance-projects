name: Quant Portfolio CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Suite & Validations
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Base Quant Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy scipy pandas

      - name: Test Project 01 (Options Pricing & Greeks Engine)
        run: |
          pytest 01-options-pricing-and-greeks/tests -v

      - name: Test Project 03 (Limit Order Book Matching Engine)
        run: |
          pytest 03-limit-order-book-simulator/tests -v

      - name: Test Project 05 (Almgren-Chriss Optimal Execution Engine)
        run: |
          pytest 05-optimal-execution-engine/tests -v
